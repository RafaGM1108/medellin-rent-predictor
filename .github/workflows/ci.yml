name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  id-token: write  # OIDC authentication for Codecov (no token secret needed)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Pre-commit
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Tests with coverage
        run: uv run pytest --cov --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          use_oidc: true
          fail_ci_if_error: true

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the API image
        run: docker build -t medellin-rent-predictor .

      - name: Smoke test /health
        run: |
          docker run -d --name api -p 8000:8000 medellin-rent-predictor
          for i in $(seq 1 30); do
            if curl -fs localhost:8000/health; then echo; break; fi
            sleep 2
          done
          curl -fs localhost:8000/health | grep -q '"status":"ok"'
          # Without a mounted model /predict must answer 503, not crash
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8000/predict \
            -H 'content-type: application/json' -d '{"comuna": "LAURELES"}')" = 503

      - name: Container logs
        if: always()
        run: docker logs api || true
