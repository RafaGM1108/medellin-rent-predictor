# Project configuration. Paths are relative to the project root.
# Override the file location with the MEDELLIN_RENT_CONF environment variable.
project:
  name: medellin-rent-predictor
  random_seed: 42

paths:
  raw: data/01_raw
  raw_listings: data/01_raw/listings
  raw_geo: data/01_raw/geo
  new_listings: data/01_raw/new_listings_sample.csv
  intermediate: data/02_intermediate
  primary: data/03_primary
  feature: data/04_feature
  model_input: data/05_model_input
  models: data/06_models
  model_output: data/07_model_output
  reporting: data/08_reporting
  mlruns: mlruns
  rent_index: conf/rent_index.json

logging:
  level: INFO

# Pipeline parameters: held-out test share, cross-validation folds, LightGBM search size.
params:
  test_size: 0.2
  cv_folds: 5
  lightgbm_tuning_iter: 20
  # Rent price adjustment (DANE CPI, effective rent): last month of the training data and
  # the month to bring predictions to. Update current_month and run `make prices`.
  rent_index:
    base_month: "2021-08"
    current_month: "2026-09"
