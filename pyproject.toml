[project]
name = "medellin-rent-predictor"
version = "0.1.0"
description = "Predicting and explaining monthly apartment rents in Medellín, Colombia."
readme = "README.md"
license = "MIT"
authors = [{ name = "Rafael García Montes" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "folium>=0.20.0",
    "geopandas>=1.2.0",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "mlflow>=3.17.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pandera>=0.34.1",
    "pyarrow>=25.0.1",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "bandit[toml]>=1.7",
    "httpx>=0.27",
    "mypy>=1.13",
    "pandas-stubs>=3.0.5.260914",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "scipy-stubs>=1.18.1.1",
    "types-pyyaml>=6.0",
]
app = ["streamlit>=1.40"]
docs = ["mkdocs-material>=9.5"]

[tool.uv]
default-groups = ["dev", "app", "docs"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medellin_rent"]

# --- ruff -------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "C4", "PT", "RUF", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"**/__main__.py" = ["D"]

# --- mypy -------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["geopandas.*", "shapely.*", "pyogrio.*", "sklearn.*", "lightgbm.*", "mlflow.*", "joblib.*"]
ignore_missing_imports = true

# --- bandit -----------------------------------------------------------------
[tool.bandit]
exclude_dirs = ["tests", ".venv"]

# --- pytest / coverage ------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.coverage.run]
source = ["medellin_rent"]
branch = true
# Streamlit UI and `python -m` entry points are exercised manually, not by unit tests.
omit = ["*/app/*", "*/__main__.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
